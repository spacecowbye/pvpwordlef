<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pvpWordle — Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Clear+Sans:wght=400;700&family=Outfit:wght=300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:             #000;
      --panel:          #0b0b0b;
      --border:         #1d1d1d;
      --text:           #f4f0ea;
      --muted:          #8b8781;
      --green:          #538d4e;
      --yellow:         #b59f3b;
      --gray:           #3a3a3c;
      --player-color:   #538d4e; /* Green for Player */
      --opponent-color: #e63946; /* Red for Opponent */
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
    }

    .shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #000;
    }

    .brand {
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 14px;
    }
    .brand span { color: #fff; }

    .meta {
      color: var(--muted);
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 0 12px;
      gap: 20px;
      position: relative;
    }

    #game-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      animation: fadeIn 0.4s ease;
    }

    #status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      font-family: monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      margin: 0;
    }

    /* Container holding board & dynamic player/opponent arrows */
    .board-container {
      position: relative;
    }

    /* Base style for dynamic indicator arrows */
    .row-arrow {
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      /* Smooth cubic-bezier transition */
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      will-change: transform;
      z-index: 10;
    }

    /* Green Player Arrow (Left Side - Points Right ►) */
    .player-arrow {
      left: -24px;
      border-left: 11px solid var(--player-color);
    }

    /* Red Opponent Arrow (Right Side - Points Left ◄) */
    .opponent-arrow {
      right: -24px;
      border-right: 11px solid var(--opponent-color);
    }

    .row-arrow.hidden {
      opacity: 0;
      transform: scale(0.5);
    }

    #game-board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
      width: 310px;
    }
    .board-row {
      display: grid;
      grid-template-columns: repeat(5, 58px);
      gap: 5px;
    }
    .tile { width: 58px; height: 58px; position: relative; }
    .tile-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.44s ease;
    }
    .tile.flipping .tile-inner { transform: rotateX(90deg); }
    .tile-face, .tile-back {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 2rem; font-weight: 700; text-transform: uppercase;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 4px;
    }
    .tile-face { border: 2px solid var(--border); background: var(--bg); color: var(--text); }
    .tile.has-letter .tile-face { border-color: #565758; }
    .tile-back { transform: rotateX(180deg); border: 2px solid transparent; }
    .tile.correct .tile-back { background: var(--green);  border-color: var(--green);  color: #fff; }
    .tile.present .tile-back { background: var(--yellow); border-color: var(--yellow); color: #fff; }
    .tile.absent  .tile-back { background: var(--gray);   border-color: var(--gray);   color: #fff; }
    .tile.revealed .tile-inner { transform: rotateX(180deg); }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-6px); }
      40%     { transform: translateX(6px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX(4px); }
    }
    .tile.shake { animation: shake 0.4s ease; }

    #keyboard {
      width: 100%; max-width: 500px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .key-row { display: flex; justify-content: center; gap: 6px; }
    .key {
      height: 58px; min-width: 43px; padding: 0 6px;
      border: 1px solid #222; background: #1a1a1a; color: var(--text);
      border-radius: 10px;
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      cursor: pointer; user-select: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .key.wide { min-width: 65px; font-size: 12px; }
    .key:active { filter: brightness(0.85); }
    .key.correct { background: var(--green);  border-color: var(--green);  color: #fff; }
    .key.present { background: var(--yellow); border-color: var(--yellow); color: #fff; }
    .key.absent  .tile-back { background: #4a4a4d;       border-color: #4a4a4d;       color: #fff; }

    .footer {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px; font-family: monospace;
      text-align: center; letter-spacing: 0.06em;
      text-transform: uppercase; min-height: 18px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .shell { padding: 12px; }
      .topbar { padding: 12px 14px; border-radius: 14px; }
      #game-board { width: 270px; }
      .row-arrow { border-top-width: 6px; border-bottom-width: 6px; }
      .player-arrow { left: -20px; border-left-width: 8px; }
      .opponent-arrow { right: -20px; border-right-width: 8px; }
      .board-row { grid-template-columns: repeat(5, 50px); }
      .tile { width: 50px; height: 50px; }
      .tile-face, .tile-back { font-size: 1.65rem; }
      #keyboard { max-width: 100%; }
      .key { height: 50px; min-width: 35px; font-size: 12px; }
      .key.wide { min-width: 52px; font-size: 11px; }
    }
  </style>
</head>
<body>

<script src="/socket.io/socket.io.js"></script>

<script src="/wordleUtils.js"></script>
<script>

let currentRow  = 0;
let opponentCurrentRow = 0;
let waitingForServer = false;
let opponentRevealRowDuration = 2000; 
let currentGuess = '';
let gameOver     = false;
let gameStarted  = true; 

let keyState = new Map();

function getTile(row, col) {
  return document.getElementById(`tile-${row + 1}-${col + 1}`);
}
function setStatus(msg) { document.getElementById('status').textContent = msg; }
function setFooter(msg) { document.getElementById('footer').textContent = msg; }

// Base arrow positioning function
function updateArrow(arrowId, rowIndex) {
  let arrow = document.getElementById(arrowId);
  if (gameOver || rowIndex >= 6) {
    arrow.classList.add('hidden');
    return;
  }

  let targetRow = document.getElementById(`row-${rowIndex + 1}`);
  if (!targetRow) return;

  let rowHeight = targetRow.offsetHeight;
  let targetTop = targetRow.offsetTop + (rowHeight / 2) - 8;

  arrow.style.transform = `translateY(${targetTop}px)`;
  arrow.classList.remove('hidden');
}

// Independent update functions
function updatePlayerArrow() {
  updateArrow('player-arrow', currentRow);
}

function updateOpponentArrow(newRow) {
  if (typeof newRow === 'number') {
    opponentCurrentRow = newRow;
  }
  updateArrow('opponent-arrow', opponentCurrentRow);
}

// Full alignment function reserved strictly for window events
function syncAllArrows() {
  updatePlayerArrow();
  updateOpponentArrow();
}

// Initial position triggers
window.addEventListener('load', syncAllArrows);
window.addEventListener('resize', syncAllArrows);

function paintCurrentRow() {
  for (let c = 0; c < 5; c++) {
    let tile = getTile(currentRow, c);
    let face = tile.querySelector('.tile-face');
    let letter = currentGuess[c] || '';
    face.textContent = letter.toUpperCase();
    tile.classList.toggle('has-letter', !!letter);
  }
}

function addLetter(letter) {
  if (currentGuess.length >= 5 || waitingForServer) return;
  currentGuess += letter.toLowerCase();
  paintCurrentRow();
}

function deleteLetter() {
  if (!currentGuess.length || waitingForServer) return;
  currentGuess = currentGuess.slice(0, -1);
  paintCurrentRow();
}

function shakeCurrentRow() {
  for (let c = 0; c < 5; c++) {
    let tile = getTile(currentRow, c);
    tile.classList.remove('shake');
    void tile.offsetWidth;
    tile.classList.add('shake');
    tile.addEventListener('animationend', () => tile.classList.remove('shake'), { once: true });
  }
}

function submitGuess() {
  if (gameOver) return;
  if (currentGuess.length !== 5) { setStatus('Not enough letters.'); shakeCurrentRow(); return; }
  if (!isValidWordleWord(currentGuess)) { setStatus('Not in word list'); shakeCurrentRow(); return }
  submitGuessToServer(currentGuess);
  currentGuess="";
  waitingForServer = true;
}

async function onGuessResult(arrayOfLettersAndStatus){
  let evaluation = [];
  let guess = "";
  for(let i = 0; i < 5; i++){
    guess += arrayOfLettersAndStatus[i].letter;
    evaluation.push(arrayOfLettersAndStatus[i].status);
  }
  console.log(`The word user guessed was : ${guess}`);
  console.log(`Its evaluation is `);
  console.log(evaluation);
  await revealRow(currentRow,guess,evaluation);
  updateKeyboard(guess,evaluation);
  if (evaluation.every(e => e === 'correct')) {
    setStatus(['Brilliant!','Magnificent!','Impressive!','Splendid!','Great!','Phew!'][currentRow]);
    gameOver = true;
    syncAllArrows();
    return;
  }
  currentRow++;

  if (currentRow >= 6) {
    setStatus(`Game over. The word was ${ANSWER.toUpperCase()}.`);
    setFooter('Better luck next time.');
    gameOver = true;
    syncAllArrows();
    return;
  }

  // Update ONLY the player's arrow position
  updatePlayerArrow();
  setStatus(`Attempt ${currentRow + 1} of 6`); 
  
  waitingForServer=false;
}

function handleKey(key) {
  if (gameOver || !gameStarted) return;
  let k = key.toUpperCase();
  if (k === 'ENTER')     { submitGuess(); return; }
  if (k === 'BACKSPACE') { deleteLetter(); return; }
  if (/^[A-Z]$/.test(k)) addLetter(k);
}

document.getElementById('keyboard').addEventListener('click', e => {
  let key = e.target.closest('[data-key]')?.dataset.key;
  if (key) handleKey(key);
});

document.addEventListener('keydown', e => {
  if (!gameStarted) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  let key = e.key === 'Backspace' ? 'BACKSPACE'
            : e.key === 'Enter'     ? 'ENTER'
            : e.key.length === 1    ? e.key.toUpperCase()
            : null;
  if (!key) return;
  if (/^[A-Z]$/.test(key) || key === 'ENTER' || key === 'BACKSPACE') {
    e.preventDefault();
    handleKey(key);
  }
});

window.addEventListener(`duel:anon:guess_result`,( payload ) => {
  let guessResultData = payload.detail;
  onGuessResult(guessResultData);
});

window.addEventListener(`duel:anon:opp_guess_result`,(payload) => {
  console.log("Opponent has guessed something");
//object will look like this
//   {
//     "opponentCurrentRow": 1,
//     "opponentGuess": [
//         {
//             "status": "absent"
//         },
//         {
//             "status": "absent"
//         },
//         {
//             "status": "absent"
//         },
//         {
//             "status": "present"
//         },
//         {
//             "status": "absent"
//         }
//     ]
// }
  let opponentGuessObject = payload.detail;
  let { opponentCurrentRow , opponentGuess} = opponentGuessObject ; 
  opponentCurrentRow = Number(opponentCurrentRow);
  updateOpponentArrow(opponentCurrentRow);

})

</script>
