<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pvpWordle — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Clear+Sans:wght=400;700&family=Outfit:wght=300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #000;
      --border: #1d1d1d;
      --text:   #f4f0ea;
      --muted:  #8b8781;
      --green:  #538d4e;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
    }

    .shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #000;
    }

    .brand {
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 14px;
    }
    .brand span { color: #fff; }

    .meta {
      color: var(--muted);
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 0 12px;
      gap: 20px;
    }

    #start-screen, #queue-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      animation: fadeIn 0.4s ease;
    }

    #start-screen { display: flex; }

    .welcome-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      margin: 0;
      text-align: center;
    }
    .welcome-title span { color: var(--green); }

    .play-btn {
      background: var(--green);
      color: #fff;
      border: none;
      padding: 14px 44px;
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(83, 141, 78, 0.3);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .play-btn:hover {
      background: #629e5c;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(83, 141, 78, 0.4);
    }
    .play-btn:active { transform: translateY(0); }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .queue-subtitle {
      color: var(--muted);
      font-family: monospace;
      font-size: 13px;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: 0.06em;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">pvp<span>wordle</span></div>
    <div class="meta">LOCAL DEV</div>
  </header>

  <main class="main">
    <div id="start-screen">
      <h1 class="welcome-title">Ready for your <span>Duel</span>?</h1>
      <button class="play-btn" id="play-button" type="button">Play</button>
    </div>

    <div id="queue-screen" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <h1 class="welcome-title">Finding an opponent<span>...</span></h1>
      <p class="queue-subtitle">Searching for a worthy duel</p>
    </div>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    socket.on('connect', () => {
      console.log('Connected:', socket.id);
    });
  function showScreen(id) {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('queue-screen').style.display = 'none';
    document.getElementById(id).style.display = 'flex';
  }

  document.getElementById('play-button').addEventListener('click', () => {
    showScreen('queue-screen');
    socket.emit('matchmaking:anon:join');

    socket.on('connect_error', (err) => {
      console.error('Socket connection failed:', err.message);
      showScreen('start-screen');
    });

    socket.on('matchmaking:anon:queued', (payload) => {
      console.log("User has been succesfully added to anonymous matchmaking queue.")
      localStorage.setItem('user_id', payload.user_id);
    });

    socket.on('matchmaking:anon:matched', (payload) => {
      const { room_id } = payload;
      window.location.href = `/duel/${room_id}`;
    });
  });
</script>
</body>
</html>
